---
deployment:
  tasks:
    - export DEPLOYPATH=/home/u1878454/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/find $DEPLOYPATH -maxdepth 1 -type f -name "*.html" -delete
    - /bin/rm -rf $DEPLOYPATH/css $DEPLOYPATH/js $DEPLOYPATH/api $DEPLOYPATH/content $DEPLOYPATH/siniflar $DEPLOYPATH/dersler $DEPLOYPATH/testler $DEPLOYPATH/ogrenci $DEPLOYPATH/ogretmen-paneli $DEPLOYPATH/assets
    - /bin/cp -f *.html $DEPLOYPATH/
    - /bin/cp -f .htaccess robots.txt sitemap.xml $DEPLOYPATH/
    - /bin/cp -Rf css $DEPLOYPATH/
    - /bin/cp -Rf js $DEPLOYPATH/
    - /bin/cp -Rf api $DEPLOYPATH/
    - /bin/cp -Rf content $DEPLOYPATH/
    - /bin/cp -Rf siniflar $DEPLOYPATH/
    - /bin/cp -Rf dersler $DEPLOYPATH/
    - /bin/cp -Rf testler $DEPLOYPATH/
    - /bin/cp -Rf ogrenci $DEPLOYPATH/
    - /bin/cp -Rf ogretmen-paneli $DEPLOYPATH/
    - /bin/cp -Rf assets $DEPLOYPATH/
    - if [ -x /usr/local/bin/php ]; then /usr/local/bin/php tools/apply-static-seo.php $DEPLOYPATH; else /usr/bin/php tools/apply-static-seo.php $DEPLOYPATH; fi
    - /bin/echo "cPanel deployment cleaned managed public_html files, copied repository files, panels, assets, and rebuilt SEO metadata."
