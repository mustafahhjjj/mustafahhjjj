<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doğal Sayılar Testi | 2. Sınıf Matematik</title><meta name="description" content="2. sınıf matematik doğal sayılar 10 soruluk test."><link rel="stylesheet" href="/css/grade1.css"><style>.g1-video-help,.video-help{margin-top:14px;padding:16px;border:2px solid #bfdbfe;border-radius:18px;background:#eff6ff;color:#173b72}.g1-video-help[hidden],.g1-video-frame[hidden],.video-help[hidden],.video-help-frame[hidden]{display:none!important}.g1-video-help strong,.video-help strong{display:block;font-size:1.05rem;margin-bottom:4px}.g1-video-help p,.video-help p{margin:0 0 12px;font-weight:800}.g1-video-frame,.video-help-frame{position:relative;aspect-ratio:16/9;margin-top:14px;border-radius:18px;overflow:hidden;background:#0f172a}.g1-video-frame iframe,.video-help-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style><script src="/js/grade2-test-page.js" defer></script></head><body class="grade1" data-mode="test" data-subject="matematik" data-topic="dogal-sayilar"><div id="app"></div><script>(function(){function makeVideoUrl(card){var question=(card.querySelector('h3,h2')||{}).textContent||'doğal sayılar basamak değeri';return 'https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent('2. sınıf matematik '+question+' konu anlatımı');}function addVideoHelp(card){if(!card||card.querySelector('.g1-video-help,.video-help'))return;var box=document.createElement('div');box.className='g1-video-help';box.innerHTML='<strong>Bu soruyu bilemedin mi?</strong><p>Kısa açıklamayı oku; sonra aynı soru için videolu anlatımı aç.</p><button class="g1-btn primary g1-video-btn" type="button">Videolu anlatımı aç</button><div class="g1-video-frame" hidden></div>';var exp=card.querySelector('.g1-explanation,.explanation');(exp||card).insertAdjacentElement('afterend',box);box.querySelector('.g1-video-btn').addEventListener('click',function(){var frame=box.querySelector('.g1-video-frame');if(!frame.dataset.loaded){frame.innerHTML='<iframe src="'+makeVideoUrl(card)+'" title="Soruyu videolu anlat" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';frame.dataset.loaded='1'}frame.hidden=false;this.textContent='Videolu anlatım açık';});}document.addEventListener('click',function(e){var button=e.target.closest('.check-answer,.option,.g1-option');if(!button)return;setTimeout(function(){var card=button.closest('.g1-question,.question-card');if(card&&card.querySelector('.wrong,.g1-option.wrong,.option.wrong'))addVideoHelp(card);},120);});})();</script></body></html>
