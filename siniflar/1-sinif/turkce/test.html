<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>1. Sınıf Türkçe Test | e-kurs.com</title><style>body{margin:0;background:#f7fbff;color:#14213d;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.55}.container{width:min(920px,calc(100% - 28px));margin:0 auto}.header{background:#fff;border-bottom:1px solid #dbe5f5}.nav{min-height:68px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;text-decoration:none;color:#14213d}.links{margin-left:auto;display:flex;gap:12px;font-weight:800}.links a{text-decoration:none;color:#14213d}.card,.question,.result{background:#fff;border:1px solid #dbe5f5;border-radius:22px;box-shadow:0 14px 34px rgba(15,23,42,.09);padding:22px;margin:20px 0}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;margin:10px 0}.lead{color:#5b6475;font-weight:750}.q{font-size:1.25rem;font-weight:900;margin-bottom:12px}.options{display:grid;gap:10px}.option{min-height:54px;border:2px solid #dbe5f5;border-radius:16px;background:#fff;text-align:left;padding:12px 14px;font-size:1.05rem;font-weight:900;cursor:pointer}.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.explain{display:none;margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:13px;color:#9a3412;font-weight:850}.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 18px;border-radius:999px;border:1px solid #bfdbfe;background:#fff;color:#1d4ed8;font-weight:900;text-decoration:none;margin:5px;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.green{background:#16a34a;color:#fff;border-color:#16a34a}.result{display:none}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;text-align:center;padding:14px;font-weight:900}.box strong{display:block;font-size:1.8rem}@media(max-width:700px){.nav{flex-wrap:wrap}.links{width:100%;margin-left:0}.score{grid-template-columns:1fr}.btn{width:100%}}</style></head>
<body><header class="header"><nav class="nav container"><a class="logo" href="/index.html">e-kurs.com</a><div class="links"><a href="/siniflar/1-sinif/turkce.html">Türkçe</a><a href="/siniflar/1-sinif/index.html">1. Sınıf</a></div></nav></header><main class="container"><section class="card"><h1 id="title">1. Sınıf Türkçe Test</h1><p class="lead">Soruları cevapla. Yanlış yaptığında açıklama açılır.</p></section><div id="quiz"></div><div><button class="btn primary" id="finish" type="button">Sonucu Göster</button><a class="btn green" href="/siniflar/1-sinif/turkce.html">Derse Dön</a></div><section class="result" id="result"><h2>Sonuç</h2><div class="score"><div class="box"><strong id="c">0</strong>Doğru</div><div class="box"><strong id="w">0</strong>Yanlış</div><div class="box"><strong id="p">0%</strong>Başarı</div></div></section></main><script>
const bank={
'cizgi-calismalari':[['Hangisi düz çizgidir?','—','○','△',0,'Düz çizgi yan yana uzanır.'],['Kalemi nasıl tutmalıyız?','Dikkatli','Fırlatarak','Isırarak',0,'Kalemi dikkatli ve rahat tutarız.'],['Çizgi çalışmasında ne yaparız?','Çizgiyi takip ederiz','Koşarız','Uyuruz',0,'Çizgiyi takip ederek elimizi hazırlarız.']],
'sesleri-tanima':[['Elma kelimesi hangi sesle başlar?','E','M','K',0,'Elma E sesiyle başlar.'],['Arı kelimesi hangi sesle başlar?','A','R','I',0,'Arı A sesiyle başlar.'],['Okul kelimesi hangi sesle başlar?','O','K','L',0,'Okul O sesiyle başlar.']],
'harfleri-tanima':[['Aşağıdakilerden hangisi harftir?','A','3','★',0,'A bir harftir.'],['E harfi hangi kelimede vardır?','el','top','kuş',0,'El kelimesinde E harfi vardır.'],['Masa kelimesi hangi harfle başlar?','M','S','A',0,'Masa M harfiyle başlar.']],
'hece-olusturma':[['a + l birleşince ne olur?','al','el','ok',0,'a ve l birleşince al hecesi olur.'],['e + l birleşince ne olur?','el','al','ol',0,'e ve l birleşince el olur.'],['o + k birleşince ne olur?','ok','ko','ak',0,'o ve k birleşince ok olur.']]
};
const p=new URLSearchParams(location.search);const key=p.get('konu')||'cizgi-calismalari';const questions=bank[key]||bank['cizgi-calismalari'];document.getElementById('title').textContent='1. Sınıf Türkçe Test';const quiz=document.getElementById('quiz');let answered=0,correct=0;questions.forEach((x,i)=>{const card=document.createElement('section');card.className='question';card.innerHTML='<div class="q">Soru '+(i+1)+': '+x[0]+'</div><div class="options">'+[1,2,3].map((n,j)=>'<button class="option" data-a="'+x[4]+'" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+x[n]+'</button>').join('')+'</div><div class="explain">'+x[5]+'</div>';quiz.appendChild(card)});quiz.addEventListener('click',e=>{const b=e.target.closest('.option');if(!b)return;const card=b.closest('.question');if(card.dataset.done)return;card.dataset.done='1';answered++;const a=Number(b.dataset.a),j=Number(b.dataset.j);card.querySelectorAll('.option').forEach((o,k)=>{if(k===a)o.classList.add('correct');if(k===j&&j!==a)o.classList.add('wrong');o.disabled=true});if(j===a)correct++;card.querySelector('.explain').style.display='block'});document.getElementById('finish').addEventListener('click',()=>{document.getElementById('c').textContent=correct;document.getElementById('w').textContent=answered-correct;document.getElementById('p').textContent=Math.round(correct/questions.length*100)+'%';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'})});
</script></body></html>
