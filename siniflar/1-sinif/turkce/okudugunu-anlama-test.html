<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Okuduğunu Anlama Testi | 1. Sınıf Türkçe</title><style>body{margin:0;background:#f7fbff;color:#14213d;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.55}.container{width:min(920px,calc(100% - 28px));margin:0 auto}.header{background:#fff;border-bottom:1px solid #dbe5f5}.nav{min-height:68px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;text-decoration:none;color:#14213d}.links{margin-left:auto;display:flex;gap:12px;font-weight:800}.links a{text-decoration:none;color:#14213d}.card,.question,.result{background:#fff;border:1px solid #dbe5f5;border-radius:22px;box-shadow:0 14px 34px rgba(15,23,42,.09);padding:22px;margin:20px 0}.reading{background:#eff6ff;border:1px solid #bfdbfe;border-radius:18px;padding:18px;font-size:1.2rem;font-weight:850}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;margin:10px 0}.q{font-size:1.25rem;font-weight:900;margin-bottom:12px}.options{display:grid;gap:10px}.option{min-height:54px;border:2px solid #dbe5f5;border-radius:16px;background:#fff;text-align:left;padding:12px 14px;font-size:1.05rem;font-weight:900;cursor:pointer}.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.explain{display:none;margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:13px;color:#9a3412;font-weight:850}.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 18px;border-radius:999px;border:1px solid #bfdbfe;background:#fff;color:#1d4ed8;font-weight:900;text-decoration:none;margin:5px;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.green{background:#16a34a;color:#fff;border-color:#16a34a}.result{display:none}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;text-align:center;padding:14px;font-weight:900}.box strong{display:block;font-size:1.8rem}@media(max-width:700px){.nav{flex-wrap:wrap}.links{width:100%;margin-left:0}.score{grid-template-columns:1fr}.btn{width:100%}}</style></head>
<body><header class="header"><nav class="nav container"><a class="logo" href="/index.html">e-kurs.com</a><div class="links"><a href="/siniflar/1-sinif/turkce.html">Türkçe</a><a href="/siniflar/1-sinif/index.html">1. Sınıf</a></div></nav></header><main class="container"><section class="card"><h1>Okuduğunu Anlama Testi</h1><div class="reading">Ali okula gitti. Çantasını açtı. Kitabını masaya koydu. Öğretmeni Ali’ye aferin dedi.</div></section><div id="quiz"></div><button class="btn primary" id="finish" type="button">Sonucu Göster</button><a class="btn green" href="/siniflar/1-sinif/turkce.html">Derse Dön</a><section class="result" id="result"><h2>Sonuç</h2><div class="score"><div class="box"><strong id="c">0</strong>Doğru</div><div class="box"><strong id="w">0</strong>Yanlış</div><div class="box"><strong id="p">0%</strong>Başarı</div></div></section></main><script>
const questions=[['Ali nereye gitti?',['Okula','Parka','Eve'],0,'Metinde Ali’nin okula gittiği yazıyor.'],['Ali neyi masaya koydu?',['Topunu','Kitabını','Elmasını'],1,'Ali kitabını masaya koydu.'],['Öğretmeni Ali’ye ne dedi?',['Aferin','Gelme','Koş'],0,'Öğretmeni Ali’ye aferin dedi.'],['Ali çantasını ne yaptı?',['Açtı','Yırttı','Attı'],0,'Metinde Ali çantasını açtı deniyor.']];const quiz=document.getElementById('quiz');let answered=0,correct=0;questions.forEach((q,i)=>{const card=document.createElement('section');card.className='question';card.innerHTML='<div class="q">Soru '+(i+1)+': '+q[0]+'</div><div class="options">'+q[1].map((x,j)=>'<button class="option" data-a="'+q[2]+'" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+x+'</button>').join('')+'</div><div class="explain">'+q[3]+'</div>';quiz.appendChild(card)});quiz.addEventListener('click',e=>{const b=e.target.closest('.option');if(!b)return;const card=b.closest('.question');if(card.dataset.done)return;card.dataset.done='1';answered++;const a=Number(b.dataset.a),j=Number(b.dataset.j);card.querySelectorAll('.option').forEach((o,k)=>{if(k===a)o.classList.add('correct');if(k===j&&j!==a)o.classList.add('wrong');o.disabled=true});if(j===a)correct++;card.querySelector('.explain').style.display='block'});document.getElementById('finish').addEventListener('click',()=>{document.getElementById('c').textContent=correct;document.getElementById('w').textContent=answered-correct;document.getElementById('p').textContent=Math.round(correct/questions.length*100)+'%';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'})});
</script></body></html>
