<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konu Anlatımı | e-kurs.com</title>
  <meta name="description" content="MEB uyumlu videolu konu anlatımı, örnek soru ve test sayfası.">
  <link rel="stylesheet" href="/css/grade1.css">
  <style>.lesson-video-card{margin:22px 0;padding:22px;border:2px solid #bfdbfe;border-radius:22px;background:#eff6ff;color:#173b72;box-shadow:0 12px 28px rgba(16,42,67,.08)}.lesson-video-card h2{margin:0 0 8px;font-size:1.55rem}.lesson-video-card p{margin:0 0 14px;font-weight:800}.lesson-video-frame{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0f172a}.lesson-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.lesson-video-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}</style>
</head>
<body class="grade1">
  <header class="g1-header"><nav class="g1-nav g1-container"><a class="g1-logo" href="/index.html"><span class="g1-logo-mark">e</span><span>e-kurs.com</span></a><div class="g1-links"><a href="/index.html">Ana Sayfa</a><a href="/siniflar/index.html">Sınıflar</a><a href="/dersler/index.html">Dersler</a><a href="/testler/index.html">Testler</a><a class="g1-btn soft" href="/giris.html">Giriş Yap</a></div></nav></header>
  <main id="topicRoot"></main>
  <footer class="g1-footer"><div class="g1-container"><strong>e-kurs.com</strong><p>Videolu konu anlatımı, örnekler ve test akışı.</p></div></footer>
  <script>
    function q(name){return new URLSearchParams(location.search).get(name)}
    function titleCase(slug){return String(slug||'konu').split('-').map(function(w){return w.charAt(0).toLocaleUpperCase('tr-TR')+w.slice(1)}).join(' ')}
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    var parts=location.pathname.split('/').filter(Boolean);
    var grade=q('grade')||((parts[1]||'2-sinif').split('-')[0])||'2';
    var subject=q('subject')||parts[2]||'matematik';
    var topic=q('topic')||parts[3]||'dogal-sayilar';
    var cleanTopic=topic.replace(/-test-1|-kolay-test|-orta-test|-zor-test|-test/g,'');
    var subjectTitle=titleCase(subject);
    var topicTitle=titleCase(cleanTopic);
    var searchText=grade+'. sınıf '+subjectTitle+' '+topicTitle+' konu anlatımı';
    var embed='https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent(searchText);
    var youtube='https://www.youtube.com/results?search_query='+encodeURIComponent(searchText);
    var testHref='/siniflar/'+grade+'-sinif/'+subject+'/'+cleanTopic+'-test.html';
    document.title=grade+'. Sınıf '+subjectTitle+' - '+topicTitle+' | e-kurs.com';
    document.getElementById('topicRoot').innerHTML='<section class="g1-hero"><div class="g1-container"><p class="g1-breadcrumb"><a href="/index.html">Ana Sayfa</a> / <a href="/siniflar/'+grade+'-sinif/index.html">'+grade+'. Sınıf</a> / <a href="/siniflar/'+grade+'-sinif/'+subject+'.html">'+esc(subjectTitle)+'</a> / '+esc(topicTitle)+'</p><div class="g1-hero-card"><span class="g1-kicker">Videolu Konu Anlatımı</span><h1>'+esc(topicTitle)+'</h1><p class="g1-lead">Önce videoyu izle, sonra kısa anlatım ve örneklerle konuyu pekiştir.</p><div class="g1-actions"><a class="g1-btn green" href="'+testHref+'">Teste Başla</a><a class="g1-btn white" href="/siniflar/'+grade+'-sinif/'+subject+'.html">Derse Dön</a></div></div></div></section><section class="g1-section"><div class="g1-container"><article class="lesson-video-card"><h2>Videolu Anlatım: '+esc(topicTitle)+'</h2><p>Bu konu için hazır video anlatımı burada açılır.</p><div class="lesson-video-frame"><iframe src="'+embed+'" title="'+esc(topicTitle)+' videolu anlatım" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="lesson-video-actions"><a class="g1-btn green" href="'+testHref+'">Video Sonrası Test</a><a class="g1-btn soft" href="'+youtube+'" target="_blank" rel="noopener">Videoyu yeni sekmede aç</a></div></article><article class="g1-topic-card"><h2>Kısa Konu Anlatımı</h2><p>'+esc(topicTitle)+' konusunu temel kavramlarla öğren. Yanlış yaptığın sorularda açıklamayı ve videolu anlatımı kullan.</p></article><div class="g1-example-grid"><div class="g1-example"><strong>Örnek 1</strong><p>Kavramı oku ve görseli dikkatle incele.</p></div><div class="g1-example"><strong>Örnek 2</strong><p>Benzer soruda hangi adımı kullanacağını belirle.</p></div><div class="g1-example"><strong>Örnek 3</strong><p>Testte aynı beceriyi tekrar çöz.</p></div></div></div></section>';
  </script>
</body>
</html>
