<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2. Sınıf Deneme Sınavı | e-kurs.com</title>
  <meta name="description" content="2. sınıf öğrencileri için 10 soruluk çocuk dostu deneme sınavı.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/siniflar/2-sinif/styles.css">
  <style>
    .exam-shell{display:grid;gap:22px;max-width:920px;margin:0 auto}
    .exam-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .exam-stat{padding:18px;border:2px solid var(--border);border-radius:20px;background:#fff;box-shadow:var(--shadow);text-align:center}
    .exam-stat strong{display:block;color:var(--text);font-size:28px;line-height:1}
    .exam-stat span{display:block;margin-top:6px;color:var(--muted);font-size:15px;font-weight:800}
    .question-card{display:grid;gap:18px;padding:26px;border:2px solid var(--border);border-radius:24px;background:#fff;box-shadow:var(--shadow-strong)}
    .question-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
    .question-code{display:inline-flex;min-height:38px;align-items:center;padding:0 14px;border-radius:999px;background:var(--soft-blue);color:var(--math);font-weight:800}
    .question-card h2{margin:0;color:var(--text)}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .choice{display:flex;min-height:62px;align-items:center;gap:12px;padding:14px 16px;border:2px solid var(--border);border-radius:18px;background:#fff;color:var(--body);font:inherit;font-weight:800;text-align:left;cursor:pointer}
    .choice:hover{border-color:var(--math);background:var(--soft-blue)}
    .choice[aria-pressed="true"]{border-color:var(--green);background:var(--soft-green)}
    .choice-letter{display:grid;width:34px;height:34px;place-items:center;flex:0 0 auto;border-radius:12px;background:#f1f5f9;color:var(--text)}
    .exam-actions{display:flex;flex-wrap:wrap;gap:14px 40px;align-items:center;justify-content:space-between}
    .feedback{min-height:52px;padding:14px 16px;border:2px solid #dbeafe;border-radius:18px;background:#eff6ff;color:#1e3a8a;font-weight:800}
    .feedback.good{border-color:#bbf7d0;background:#ecfdf5;color:#166534}
    .feedback.bad{border-color:#fecaca;background:#fff1f2;color:#991b1b}
    .result-panel{display:none;padding:24px;border:2px solid #bbf7d0;border-radius:24px;background:linear-gradient(135deg,#fff,#ecfdf5);box-shadow:var(--shadow-strong)}
    .result-panel.is-visible{display:grid;gap:14px}
    .review-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
    .review-list li{padding:12px;border:1px solid var(--border);border-radius:14px;background:#fff;font-weight:700}
    @media(max-width:700px){.exam-status,.choice-grid{grid-template-columns:1fr}.exam-actions .btn{width:100%}}
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Ana menü">
      <a class="logo" href="/index.html" aria-label="e-kurs.com ana sayfa"><span class="logo-mark">e</span><span>e-kurs.com</span></a>
      <div class="nav-links"><a href="/siniflar/index.html">Sınıflar</a><a href="/dersler/index.html">Dersler</a><a class="active" href="/testler/index.html">Testler</a></div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb">Testler / 2. Sınıf</p>
        <h1>2. Sınıf Deneme Sınavı</h1>
        <p class="lead">10 soruluk kısa tekrar. Her soruyu çöz, sonucu hemen gör, yanlışlarını en sonda tekrar et.</p>
      </div>
    </section>

    <section class="section">
      <div class="container exam-shell">
        <div class="exam-status" aria-label="Sınav durumu">
          <div class="exam-stat"><strong id="questionNo">1/10</strong><span>Soru</span></div>
          <div class="exam-stat"><strong id="scoreNow">0</strong><span>Doğru</span></div>
          <div class="exam-stat"><strong id="remainingNow">10</strong><span>Kalan</span></div>
        </div>

        <article class="question-card" aria-live="polite">
          <div class="question-top"><span id="questionCode" class="question-code">Matematik</span><span class="pill">2. sınıf</span></div>
          <h2 id="questionText">Soru yükleniyor...</h2>
          <div id="choices" class="choice-grid"></div>
          <div id="feedback" class="feedback">Cevabını seç ve kontrol et.</div>
          <div class="exam-actions">
            <button id="checkBtn" class="btn btn-primary" type="button">Cevabı Kontrol Et</button>
            <button id="nextBtn" class="btn btn-light" type="button" disabled>Sonraki Soru</button>
          </div>
        </article>

        <section id="resultPanel" class="result-panel" aria-live="polite">
          <h2 id="resultTitle">Sonuç</h2>
          <p id="resultText" class="lead"></p>
          <ul id="reviewList" class="review-list"></ul>
          <div class="exam-actions">
            <button id="restartBtn" class="btn btn-primary" type="button">Tekrar Çöz</button>
            <a class="btn btn-light" href="/testler/2-sinif.html">2. Sınıf Testlerine Dön</a>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function(){
      var questions=[
        {code:'Matematik',text:'23 + 14 işleminin sonucu kaçtır?',choices:['27','37','47','39'],answer:1,explain:'23 + 14 = 37.'},
        {code:'Matematik',text:'45 sayısında kaç onluk vardır?',choices:['4','5','40','45'],answer:0,explain:'45 sayısında 4 onluk ve 5 birlik vardır.'},
        {code:'Matematik',text:'Bir kutuda 3 kalem var. 4 kutuda kaç kalem olur?',choices:['7','10','12','14'],answer:2,explain:'3 + 3 + 3 + 3 = 12.'},
        {code:'Türkçe',text:'“Ali okula gitti.” cümlesinde kim okula gitti?',choices:['Okul','Ali','Gitti','Cümle'],answer:1,explain:'Cümlede işi yapan kişi Ali.'},
        {code:'Türkçe',text:'Hangi kelime doğru yazılmıştır?',choices:['kitab','kalemm','çiçek','sınıff'],answer:2,explain:'Doğru yazım “çiçek”tir.'},
        {code:'Hayat Bilgisi',text:'Karşıdan karşıya geçerken önce ne yapmalıyız?',choices:['Koşmalıyız','Sağa sola bakmalıyız','Gözümüzü kapatmalıyız','Yola atlamalıyız'],answer:1,explain:'Güvenli geçiş için sağa ve sola bakılır.'},
        {code:'Hayat Bilgisi',text:'Diş sağlığımız için hangisini yapmalıyız?',choices:['Dişleri fırçalamak','Çok şeker yemek','Diş fırçasını hiç kullanmamak','Suyu boşa akıtmak'],answer:0,explain:'Dişlerimizi düzenli fırçalamalıyız.'},
        {code:'İngilizce',text:'“Red” hangi renktir?',choices:['Mavi','Kırmızı','Yeşil','Sarı'],answer:1,explain:'Red, kırmızı demektir.'},
        {code:'Matematik',text:'Saat 3’ten 2 saat sonra saat kaç olur?',choices:['4','5','6','7'],answer:1,explain:'3’ten 2 saat sonrası 5’tir.'},
        {code:'Matematik',text:'Aşağıdakilerden hangisi geometrik cisimdir?',choices:['Üçgen','Kare','Küp','Çember'],answer:2,explain:'Küp bir geometrik cisimdir.'}
      ];
      var index=0,selected=null,score=0,answers=[];
      var questionNo=document.getElementById('questionNo');
      var scoreNow=document.getElementById('scoreNow');
      var remainingNow=document.getElementById('remainingNow');
      var questionCode=document.getElementById('questionCode');
      var questionText=document.getElementById('questionText');
      var choices=document.getElementById('choices');
      var feedback=document.getElementById('feedback');
      var checkBtn=document.getElementById('checkBtn');
      var nextBtn=document.getElementById('nextBtn');
      var resultPanel=document.getElementById('resultPanel');
      var resultTitle=document.getElementById('resultTitle');
      var resultText=document.getElementById('resultText');
      var reviewList=document.getElementById('reviewList');
      var restartBtn=document.getElementById('restartBtn');

      function render(){
        var q=questions[index];
        selected=null;
        questionNo.textContent=(index+1)+'/'+questions.length;
        scoreNow.textContent=String(score);
        remainingNow.textContent=String(questions.length-index);
        questionCode.textContent=q.code;
        questionText.textContent=q.text;
        choices.innerHTML='';
        feedback.className='feedback';
        feedback.textContent='Cevabını seç ve kontrol et.';
        checkBtn.disabled=false;
        nextBtn.disabled=true;
        q.choices.forEach(function(choice,choiceIndex){
          var button=document.createElement('button');
          button.type='button';
          button.className='choice';
          button.setAttribute('aria-pressed','false');
          button.innerHTML='<span class="choice-letter">'+String.fromCharCode(65+choiceIndex)+'</span><span>'+choice+'</span>';
          button.addEventListener('click',function(){
            selected=choiceIndex;
            choices.querySelectorAll('.choice').forEach(function(item){item.setAttribute('aria-pressed','false');});
            button.setAttribute('aria-pressed','true');
          });
          choices.appendChild(button);
        });
      }
      function check(){
        if(selected===null){
          feedback.className='feedback bad';
          feedback.textContent='Önce bir cevap seçmelisin.';
          return;
        }
        var q=questions[index];
        var correct=selected===q.answer;
        if(correct)score+=1;
        answers[index]={correct:correct,selected:selected};
        feedback.className='feedback '+(correct?'good':'bad');
        feedback.textContent=correct?'Harika, doğru cevap! '+q.explain:'Bir daha bakalım. Doğru cevap: '+q.choices[q.answer]+'. '+q.explain;
        checkBtn.disabled=true;
        nextBtn.disabled=false;
        scoreNow.textContent=String(score);
      }
      function finish(){
        resultPanel.classList.add('is-visible');
        resultTitle.textContent='Sonuç: '+score+'/'+questions.length;
        resultText.textContent=score>=8?'Çok iyi! Konuları güçlü öğrenmişsin.':score>=5?'Güzel gidiyorsun. Yanlış yaptığın soruları tekrar et.':'Biraz daha tekrar iyi gelir. Kısa kısa yeniden çözebilirsin.';
        reviewList.innerHTML='';
        questions.forEach(function(q,i){
          if(answers[i]&&answers[i].correct)return;
          var li=document.createElement('li');
          li.textContent=(i+1)+'. soru: '+q.text+' Doğru cevap: '+q.choices[q.answer]+'.';
          reviewList.appendChild(li);
        });
        if(!reviewList.children.length){
          var li=document.createElement('li');
          li.textContent='Tüm sorular doğru. Yıldızı hak ettin!';
          reviewList.appendChild(li);
        }
        resultPanel.scrollIntoView({behavior:'smooth',block:'start'});
      }
      checkBtn.addEventListener('click',check);
      nextBtn.addEventListener('click',function(){
        if(index<questions.length-1){index+=1;render();}
        else finish();
      });
      restartBtn.addEventListener('click',function(){
        index=0;selected=null;score=0;answers=[];resultPanel.classList.remove('is-visible');render();window.scrollTo({top:0,behavior:'smooth'});
      });
      render();
    })();
  </script>
  <script src="/js/main.js"></script>
</body>
</html>
